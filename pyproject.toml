[project]
name = "study-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "518luck", email = "165388484+518luck@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.5.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
study-agent = "study_agent:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
